[package]
name = "paymybill"
version = "0.1.0"
description = "Post a bill, let a stranger pay it. Fully onchain on Solana."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "paymybill"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ident = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
